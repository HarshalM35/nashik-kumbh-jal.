<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nashik Kumbh Jal | Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: auto;
        }

        .login-box,
        .admin-panel {
            background: #0d1b2a;
            border: 1px solid #26384a;
            border-radius: 16px;
            padding: 25px;
        }

        .login-box {
            max-width: 430px;
            margin: 70px auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 9px;
            font-size: 14px;
        }

        input,
        select {
            background: #07111f;
            color: white;
            border: 1px solid #334155;
        }

        select option {
            background: #07111f;
            color: white;
        }

        button {
            border: none;
            background: #38bdf8;
            color: #00111c;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 15px;
            color: #fbbf24;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .logout {
            width: auto;
            padding: 11px 20px;
            background: #ef4444;
            color: white;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #102337;
            border: 1px solid #26384a;
            border-radius: 12px;
            padding: 18px;
        }

        .stat p {
            color: #94a3b8;
            font-size: 14px;
        }

        .stat h2 {
            margin-top: 8px;
            font-size: 28px;
        }

        /* CONTROLS */

        .controls {
            background: #102337;
            border: 1px solid #26384a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;

            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto auto;
            gap: 10px;
        }

        .controls input,
        .controls select {
            margin-top: 0;
        }

        .control-btn {
            width: auto;
            margin-top: 0;
            padding: 12px 18px;
        }

        .export-btn {
            background: #8b5cf6;
            color: white;
        }

        .refresh {
            background: #38bdf8;
        }

        /* ORDERS */

        .orders-box {
            background: #0b1725;
            border: 1px solid #26384a;
            border-radius: 12px;
            padding: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1450px;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #26384a;
            text-align: left;
            vertical-align: middle;
        }

        th {
            color: #38bdf8;
            white-space: nowrap;
        }

        td {
            font-size: 13px;
        }

        .status {
            display: inline-block;
            padding: 6px 9px;
            border-radius: 7px;
            background: #1e293b;
            font-size: 12px;
            white-space: nowrap;
        }

        .pending {
            background: #92400e;
        }

        .verified {
            background: #166534;
        }

        .rejected {
            background: #991b1b;
        }

        .delivered {
            background: #065f46;
        }

        .action-btn {
            width: auto;
            padding: 7px 9px;
            margin: 2px;
            font-size: 11px;
        }

        .confirm-btn {
            background: #22c55e;
            color: white;
        }

        .reject-btn {
            background: #ef4444;
            color: white;
        }

        .view-btn {
            background: #6366f1;
            color: white;
        }

        .tracking-btn {
            background: #f59e0b;
            color: #111827;
        }

        .status-btn {
            background: #06b6d4;
            color: #00111c;
        }

        .loading {
            color: #94a3b8;
            padding: 20px;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 30px;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            z-index: 9999;
        }

        .modal-box {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;

            background: #0d1b2a;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            width: auto;
            background: #ef4444;
            color: white;
            padding: 8px 13px;
            margin: 0;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail {
            background: #102337;
            border: 1px solid #26384a;
            border-radius: 10px;
            padding: 12px;
        }

        .detail.full {
            grid-column: 1 / -1;
        }

        .detail-label {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            word-break: break-word;
        }

        .products-box {
            background: #07111f;
            border: 1px solid #26384a;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: 13px;
            max-height: 250px;
            overflow-y: auto;
        }

        .no-order {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        /* RESPONSIVE */

        @media (max-width: 1100px) {
            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .control-btn {
                width: 100%;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .logout {
                width: 100%;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .detail.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <div id="loginBox" class="login-box">

        <h1>🔐 Admin Login</h1>

        <p class="subtitle">
            Nashik Kumbh Jal
        </p>

        <input
            type="email"
            id="adminEmail"
            value="editorharsh64@gmail.com"
            placeholder="Admin Email"
        >

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
        >

        <button id="loginBtn">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel" class="admin-panel hidden">

        <!-- TOP BAR -->

        <div class="topbar">

            <div>

                <h1>
                    ⚡ Nashik Kumbh Jal
                </h1>

                <p class="subtitle">
                    Admin Order Management Panel
                </p>

            </div>

            <button
                id="logoutBtn"
                class="logout"
            >
                Logout
            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <p>Total Orders</p>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="stat">
                <p>Pending Payment</p>
                <h2 id="pendingOrders">0</h2>
            </div>

            <div class="stat">
                <p>Verified</p>
                <h2 id="verifiedOrders">0</h2>
            </div>

            <div class="stat">
                <p>Rejected</p>
                <h2 id="rejectedOrders">0</h2>
            </div>

            <div class="stat">
                <p>Delivered</p>
                <h2 id="deliveredOrders">0</h2>
            </div>

        </div>


        <!-- SEARCH / FILTER -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search Order ID / Name / Mobile"
            >

            <select id="paymentFilter">

                <option value="all">
                    All Payments
                </option>

                <option value="Pending Verification">
                    Pending Verification
                </option>

                <option value="Verified">
                    Verified
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>


            <select id="statusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="Payment Submitted">
                    Payment Submitted
                </option>

                <option value="Payment Confirmed">
                    Payment Confirmed
                </option>

                <option value="Packed">
                    Packed
                </option>

                <option value="Shipped">
                    Shipped
                </option>

                <option value="Out for Delivery">
                    Out for Delivery
                </option>

                <option value="Delivered">
                    Delivered
                </option>

                <option value="Payment Rejected">
                    Payment Rejected
                </option>

            </select>


            <button
                id="refreshBtn"
                class="control-btn refresh"
            >
                🔄 Refresh
            </button>


            <button
                id="exportBtn"
                class="control-btn export-btn"
            >
                📥 Export CSV
            </button>

        </div>


        <!-- ORDERS TABLE -->

        <div class="orders-box">

            <table>

                <thead>

                    <tr>

                        <th>
                            Order ID
                        </th>

                        <th>
                            Customer
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Amount
                        </th>

                        <th>
                            Payment
                        </th>

                        <th>
                            Order Status
                        </th>

                        <th>
                            Tracking
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="ordersTable">

                    <tr>

                        <td
                            colspan="8"
                            class="loading"
                        >
                            Login to load orders.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- ORDER DETAILS MODAL -->

<div
    id="detailsModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                📋 Order Details
            </h2>

            <button
                id="closeModalBtn"
                class="close-btn"
            >
                ✕ Close
            </button>

        </div>


        <div
            id="orderDetails"
            class="detail-grid"
        >
        </div>

    </div>

</div>


<script type="module">

    import {
        signInWithEmailAndPassword,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
        collection,
        getDocs,
        doc,
        updateDoc
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    import {
        auth,
        db
    } from "./firebase.js";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginBox =
        document.getElementById("loginBox");

    const adminPanel =
        document.getElementById("adminPanel");

    const emailInput =
        document.getElementById("adminEmail");

    const passwordInput =
        document.getElementById("adminPassword");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const loginMessage =
        document.getElementById("loginMessage");

    const ordersTable =
        document.getElementById("ordersTable");

    const searchInput =
        document.getElementById("searchInput");

    const paymentFilter =
        document.getElementById("paymentFilter");

    const statusFilter =
        document.getElementById("statusFilter");

    const detailsModal =
        document.getElementById("detailsModal");

    const orderDetails =
        document.getElementById("orderDetails");


    /* =====================================================
       GLOBAL ORDERS
    ===================================================== */

    let allOrders = [];


    /* =====================================================
       LOGIN
    ===================================================== */

    loginBtn.addEventListener(
        "click",
        async () => {

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                loginMessage.textContent =
                    "Please enter email and password.";

                return;
            }


            loginBtn.disabled = true;

            loginBtn.textContent =
                "Logging in...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                loginMessage.textContent = "";

                loginBox.classList.add(
                    "hidden"
                );

                adminPanel.classList.remove(
                    "hidden"
                );


                await loadOrders();

            }
            catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                loginMessage.textContent =
                    "Login failed. Check email and password.";

            }


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Login";

        }
    );


    /* =====================================================
       LOGOUT
    ===================================================== */

    logoutBtn.addEventListener(
        "click",
        async () => {

            try {

                await signOut(auth);

                adminPanel.classList.add(
                    "hidden"
                );

                loginBox.classList.remove(
                    "hidden"
                );

                passwordInput.value = "";

            }
            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

            }

        }
    );


    /* =====================================================
       LOAD ORDERS
    ===================================================== */

    async function loadOrders() {

        ordersTable.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="loading"
                >
                    Loading orders...
                </td>

            </tr>

        `;


        try {

            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "Orders"
                    )
                );


            allOrders = [];


            snapshot.forEach(
                (orderDoc) => {

                    allOrders.push({

                        id: orderDoc.id,

                        data: orderDoc.data()

                    });

                }
            );


            /* newest first */

            allOrders.sort(
                (a, b) => {

                    const dateA =
                        new Date(
                            a.data.firebaseSavedAt ||
                            a.data.createdAt ||
                            0
                        );

                    const dateB =
                        new Date(
                            b.data.firebaseSavedAt ||
                            b.data.createdAt ||
                            0
                        );

                    return dateB - dateA;

                }
            );


            updateStats();

            renderOrders();

        }
        catch (error) {

            console.error(
                "Orders loading error:",
                error
            );


            ordersTable.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="loading"
                    >
                        Unable to load orders.
                    </td>

                </tr>

            `;

        }

    }


    /* =====================================================
       UPDATE STATS
    ===================================================== */

    function updateStats() {

        let total = 0;

        let pending = 0;

        let verified = 0;

        let rejected = 0;

        let delivered = 0;


        allOrders.forEach(
            ({ data }) => {

                total++;


                if (
                    data.paymentStatus ===
                    "Pending Verification"
                ) {

                    pending++;

                }


                if (
                    data.paymentStatus ===
                    "Verified"
                ) {

                    verified++;

                }


                if (
                    data.paymentStatus ===
                    "Rejected"
                ) {

                    rejected++;

                }


                if (
                    data.orderStatus ===
                    "Delivered"
                ) {

                    delivered++;

                }

            }
        );


        document.getElementById(
            "totalOrders"
        ).textContent = total;


        document.getElementById(
            "pendingOrders"
        ).textContent = pending;


        document.getElementById(
            "verifiedOrders"
        ).textContent = verified;


        document.getElementById(
            "rejectedOrders"
        ).textContent = rejected;


        document.getElementById(
            "deliveredOrders"
        ).textContent = delivered;

    }


    /* =====================================================
       RENDER ORDERS
    ===================================================== */

    function renderOrders() {

        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        const payment =
            paymentFilter.value;


        const status =
            statusFilter.value;


        const filtered =
            allOrders.filter(
                ({ id, data }) => {

                    const orderId =
                        String(
                            data.orderId ||
                            id ||
                            ""
                        ).toLowerCase();


                    const name =
                        String(
                            data.name ||
                            data.customerName ||
                            ""
                        ).toLowerCase();


                    const mobile =
                        String(
                            data.mobile ||
                            data.phone ||
                            ""
                        ).toLowerCase();


                    const searchMatch =
                        !search ||
                        orderId.includes(search) ||
                        name.includes(search) ||
                        mobile.includes(search);


                    const paymentMatch =
                        payment === "all" ||
                        data.paymentStatus === payment;


                    const statusMatch =
                        status === "all" ||
                        data.orderStatus === status;


                    return (
                        searchMatch &&
                        paymentMatch &&
                        statusMatch
                    );

                }
            );


        ordersTable.innerHTML = "";


        if (filtered.length === 0) {

            ordersTable.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="empty"
                    >
                        No matching orders found.
                    </td>

                </tr>

            `;

            return;

        }


        filtered.forEach(
            ({ id, data }) => {

                createOrderRow(
                    id,
                    data
                );

            }
        );

    }


    /* =====================================================
       CREATE ORDER ROW
    ===================================================== */

    function createOrderRow(
        documentId,
        order
    ) {

        const row =
            document.createElement("tr");


        /* ORDER ID */

        addCell(
            row,
            order.orderId ||
            documentId
        );


        /* CUSTOMER */

        addCell(
            row,
            order.name ||
            order.customerName ||
            "-"
        );


        /* MOBILE */

        addCell(
            row,
            order.mobile ||
            order.phone ||
            "-"
        );


        /* AMOUNT */

        addCell(
            row,
            "₹" +
            (
                order.finalAmount ||
                order.amount ||
                0
            )
        );


        /* PAYMENT */

        const paymentCell =
            document.createElement("td");


        const paymentStatus =
            document.createElement("span");


        paymentStatus.className =
            "status " +
            getPaymentClass(
                order.paymentStatus
            );


        paymentStatus.textContent =
            order.paymentStatus ||
            "-";


        paymentCell.appendChild(
            paymentStatus
        );


        row.appendChild(
            paymentCell
        );


        /* ORDER STATUS */

        const statusCell =
            document.createElement("td");


        const statusSpan =
            document.createElement("span");


        statusSpan.className =
            "status";


        statusSpan.textContent =
            order.orderStatus ||
            "-";


        statusCell.appendChild(
            statusSpan
        );


        row.appendChild(
            statusCell
        );


        /* TRACKING */

        addCell(
            row,
            order.trackingNumber ||
            "-"
        );


        /* ACTIONS */

        const actionCell =
            document.createElement("td");


        /* VIEW */

        const viewBtn =
            document.createElement("button");


        viewBtn.textContent =
            "👁 View";


        viewBtn.className =
            "action-btn view-btn";


        viewBtn.onclick =
            () => showOrderDetails(
                documentId,
                order
            );


        actionCell.appendChild(
            viewBtn
        );


        /* PAYMENT */

        if (
            order.paymentStatus ===
            "Pending Verification"
        ) {

            const confirmBtn =
                document.createElement("button");


            confirmBtn.textContent =
                "✓ Confirm";


            confirmBtn.className =
                "action-btn confirm-btn";


            confirmBtn.onclick =
                () => confirmPayment(
                    documentId
                );


            actionCell.appendChild(
                confirmBtn
            );


            const rejectBtn =
                document.createElement("button");


            rejectBtn.textContent =
                "✕ Reject";


            rejectBtn.className =
                "action-btn reject-btn";


            rejectBtn.onclick =
                () => rejectPayment(
                    documentId
                );


            actionCell.appendChild(
                rejectBtn
            );

        }


        /* STATUS */

        if (
            order.paymentStatus ===
            "Verified"
        ) {

            const statusBtn =
                document.createElement("button");


            statusBtn.textContent =
                "📦 Status";


            statusBtn.className =
                "action-btn status-btn";


            statusBtn.onclick =
                () => changeOrderStatus(
                    documentId,
                    order
                );


            actionCell.appendChild(
                statusBtn
            );


            const trackingBtn =
                document.createElement("button");


            trackingBtn.textContent =
                "🚚 Tracking";


            trackingBtn.className =
                "action-btn tracking-btn";


            trackingBtn.onclick =
                () => editTracking(
                    documentId,
                    order
                );


            actionCell.appendChild(
                trackingBtn
            );

        }


        row.appendChild(
            actionCell
        );


        ordersTable.appendChild(
            row
        );

    }


    /* =====================================================
       PAYMENT CONFIRM
    ===================================================== */

    async function confirmPayment(
        orderId
    ) {

        const yes =
            confirm(
                "Confirm this payment?"
            );


        if (!yes) return;


        try {

            await updateDoc(
                doc(
                    db,
                    "Orders",
                    orderId
                ),
                {

                    paymentStatus:
                        "Verified",

                    orderStatus:
                        "Payment Confirmed",

                    paymentVerifiedAt:
                        new Date().toISOString()

                }
            );


            alert(
                "Payment Confirmed successfully!"
            );


            await loadOrders();

        }
        catch (error) {

            console.error(
                "Payment confirmation error:",
                error
            );


            alert(
                "Payment could not be confirmed."
            );

        }

    }


    /* =====================================================
       PAYMENT REJECT
    ===================================================== */

    async function rejectPayment(
        orderId
    ) {

        const yes =
            confirm(
                "Are you sure you want to reject this payment?"
            );


        if (!yes) return;


        try {

            await updateDoc(
                doc(
                    db,
                    "Orders",
                    orderId
                ),
                {

                    paymentStatus:
                        "Rejected",

                    orderStatus:
                        "Payment Rejected",

                    paymentRejectedAt:
                        new Date().toISOString()

                }
            );


            alert(
                "Payment Rejected."
            );


            await loadOrders();

        }
        catch (error) {

            console.error(
                "Payment rejection error:",
                error
            );


            alert(
                "Payment could not be rejected."
            );

        }

    }


    /* =====================================================
       CHANGE ORDER STATUS
    ===================================================== */

    async function changeOrderStatus(
        orderId,
        order
    ) {

        const statuses = [

            "Payment Confirmed",

            "Packed",

            "Shipped",

            "Out for Delivery",

            "Delivered"

        ];


        const currentIndex =
            statuses.indexOf(
                order.orderStatus
            );


        let message =
            "Select status number:\n\n";


        statuses.forEach(
            (status, index) => {

                message +=
                    (index + 1) +
                    ". " +
                    status +
                    "\n";

            }
        );


        message +=
            "\nCurrent: " +
            (
                order.orderStatus ||
                "None"
            );


        const input =
            prompt(message);


        if (input === null) {
            return;
        }


        const selected =
            parseInt(input);


        if (
            isNaN(selected) ||
            selected < 1 ||
            selected > statuses.length
        ) {

            alert(
                "Invalid status number."
            );

            return;

        }


        const newStatus =
            statuses[selected - 1];


        if (
            selected < currentIndex + 1
        ) {

            const confirmBack =
                confirm(
                    "This will move the order to an earlier status. Continue?"
                );


            if (!confirmBack) {
                return;
            }

        }


        try {

            const updateData = {

                orderStatus:
                    newStatus,

                statusUpdatedAt:
                    new Date().toISOString()

            };


            if (
                newStatus ===
                "Delivered"
            ) {

                updateData.deliveredAt =
                    new Date().toISOString();

            }


            await updateDoc(
                doc(
                    db,
                    "Orders",
                    orderId
                ),
                updateData
            );


            alert(
                "Order status updated!"
            );


            await loadOrders();

        }
        catch (error) {

            console.error(
                "Status update error:",
                error
            );


            alert(
                "Order status could not be updated."
            );

        }

    }


    /* =====================================================
       TRACKING NUMBER
    ===================================================== */

    async function editTracking(
        orderId,
        order
    ) {

        const current =
            order.trackingNumber ||
            "";


        const tracking =
            prompt(
                "Enter Tracking Number:",
                current
            );


        if (tracking === null) {
            return;
        }


        try {

            await updateDoc(
                doc(
                    db,
                    "Orders",
                    orderId
                ),
                {

                    trackingNumber:
                        tracking.trim(),

                    trackingUpdatedAt:
                        new Date().toISOString()

                }
            );


            alert(
                "Tracking number updated!"
            );


            await loadOrders();

        }
        catch (error) {

            console.error(
                "Tracking update error:",
                error
            );


            alert(
                "Tracking number could not be updated."
            );

        }

    }


    /* =====================================================
       ORDER DETAILS
    ===================================================== */

        orderDetails.innerHTML = "";


        addDetail(
            "Order ID",
            order.orderId ||
            documentId
        );


        addDetail(
            "Customer Name",
            order.name ||
            order.customerName ||
            "-"
        );


        addDetail(
            "Mobile",
            order.mobile ||
            order.phone ||
            "-"
        );


        addDetail(
            "Email",
            order.email ||
            "-"
        );


        addDetail(
            "Amount",
            "₹" +
            (
                order.finalAmount ||
                order.amount ||
                0
            )
        );


        addDetail(
            "Payment Status",
            order.paymentStatus ||
            "-"
        );


        addDetail(
            "Order Status",
            order.orderStatus ||
            "-"
        );


        addDetail(
            "Tracking Number",
            order.trackingNumber ||
            "-"
        );


        addDetail(
            "PIN Code",
            order.pincode ||
            order.pin ||
            order.pinCode ||
            "-"
        );


        addDetail(
            "Address",
            order.address ||
            order.fullAddress ||
            "-",
            true
        );


        /* PRODUCTS */

        const productsDetail =
            document.createElement("div");


        productsDetail.className =
            "detail full";


        const productLabel =
            document.createElement("div");


        productLabel.className =
            "detail-label";


        productLabel.textContent =
            "Products";


        const productBox =
            document.createElement("div");


        productBox.className =
            "products-box";


        productBox.textContent =
            formatProducts(
                order.items ||
                order.products ||
                order.cart ||
                []
            );


        productsDetail.appendChild(
            productLabel
        );


        productsDetail.appendChild(
            productBox
        );


        orderDetails.appendChild(
            productsDetail
        );


        /* RAW DATA */

        const rawDetail =
            document.createElement("div");


        rawDetail.className =
            "detail full";


        const rawLabel =
            document.createElement("div");


        rawLabel.className =
            "detail-label";


        rawLabel.textContent =
            "Order Data";


        const rawBox =
            document.createElement("div");


        rawBox.className =
            "products-box";


        rawBox.textContent =
            JSON.stringify(
                order,
                null,
                2
            );


        rawDetail.appendChild(
            rawLabel
        );


        rawDetail.appendChild(
            rawBox
        );


        orderDetails.appendChild(
            rawDetail
        );


        detailsModal.classList.remove(
            "hidden"
        );

    }


    /* =====================================================
       ADD DETAIL
    ===================================================== */

    function addDetail(
        label,
        value,
        full = false
    ) {

        const box =
            document.createElement("div");


        box.className =
            "detail" +
            (
                full
                    ? " full"
                    : ""
            );


        const labelElement =
            document.createElement("div");


        labelElement.className =
            "detail-label";


        labelElement.textContent =
            label;


        const valueElement =
            document.createElement("div");


        valueElement.className =
            "detail-value";


        valueElement.textContent =
            value;


        box.appendChild(
            labelElement
        );


        box.appendChild(
            valueElement
        );


        orderDetails.appendChild(
            box
        );

    }


    /* =====================================================
       FORMAT PRODUCTS
    ===================================================== */

    function formatProducts(
        products
    ) {

        if (
            !products ||
            (
                Array.isArray(products) &&
                products.length === 0
            )
        ) {

            return "No product information available.";

        }


        if (
            typeof products ===
            "string"
        ) {

            return products;

        }


        try {

            return JSON.stringify(
                products,
                null,
                2
            );

        }
        catch {

            return String(
                products
            );

        }

    }


    /* =====================================================
       PAYMENT CLASS
    ===================================================== */

    function getPaymentClass(
        status
    ) {

        if (
            status ===
            "Pending Verification"
        ) {

            return "pending";

        }


        if (
            status ===
            "Verified"
        ) {

            return "verified";

        }


        if (
            status ===
            "Rejected"
        ) {

            return "rejected";

        }


        return "";

    }


    /* =====================================================
       ADD TABLE CELL
    ===================================================== */

    function addCell(
        row,
        value
    ) {

        const cell =
            document.createElement("td");


        cell.textContent =
            value;


        row.appendChild(
            cell
        );

    }

    /* =====================================================
       CSV EXPORT
    ===================================================== */

    document
        .getElementById("exportBtn")
        .addEventListener(
            "click",
            exportCSV
        );


    function exportCSV() {

        if (
            allOrders.length === 0
        ) {

            alert(
                "No orders available to export."
            );

            return;

        }


        const headers = [

            "Order ID",

            "Customer",

            "Mobile",

            "Email",

            "Amount",

            "Payment Status",

            "Order Status",

            "Tracking Number",

            "PIN Code"

        ];


        const rows =
            allOrders.map(
                ({ id, data }) => [

                    data.orderId || id,

                    data.name ||
                    data.customerName ||
                    "",

                    data.mobile ||
                    data.phone ||
                    "",

                    data.email ||
                    "",

                    data.finalAmount ||
                    data.amount ||
                    0,

                    data.paymentStatus ||
                    "",

                    data.orderStatus ||
                    "",

                    data.trackingNumber ||
                    "",

                    data.pincode ||
                    data.pin ||
                    data.pinCode ||
                    ""

                ]
            );


        const csv = [

            headers,

            ...rows

        ]
            .map(
                row =>
                    row
                        .map(
                            value =>
                                `"${String(value)
                                    .replace(
                                        /"/g,
                                        '""'
                                    )}"`
                        )
                        .join(",")
            )
            .join("\n");


        const blob =
            new Blob(
                [csv],
                {
                    type:
                        "text/csv;charset=utf-8;"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            "Nashik-Kumbh-Jal-Orders.csv";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );

    }
