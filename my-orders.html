<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Nashik Kumbh Jal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #08152b;
            border-bottom: 1px solid rgba(255, 215, 106, 0.25);
            padding: 18px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #ffd76a;
            font-size: 25px;
        }

        header p {
            margin: 6px 0 0;
            color: #aaa;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .top-bar h2 {
            margin: 0;
            color: #9de7ff;
        }

        .home-btn {
            border: 0;
            padding: 10px 16px;
            border-radius: 9px;
            background: #9de7ff;
            color: #061321;
            font-weight: bold;
            cursor: pointer;
        }

        .order-card {
            background: #08152b;
            border: 1px solid rgba(255, 215, 106, 0.25);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            padding-bottom: 15px;
        }

        .order-id {
            color: #ffd76a;
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            padding: 7px 11px;
            border-radius: 20px;
            background: rgba(157, 231, 255, .12);
            color: #9de7ff;
            font-size: 13px;
            font-weight: bold;
        }

        .order-info {
            margin-top: 15px;
        }

        .order-info p {
            margin: 8px 0;
            color: #ddd;
        }

        .products {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, .04);
            border-radius: 10px;
        }

        .products strong {
            color: #ffd76a;
        }

        .total {
            margin-top: 15px;
            font-size: 21px;
            color: #ffd76a;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .buttons button {
            flex: 1;
            border: 0;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .track-btn {
            background: #ffd76a;
            color: #241600;
        }

        .invoice-btn {
            background: #ffffff;
            color: #061321;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            background: #08152b;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .1);
        }

        .empty-icon {
            font-size: 50px;
        }

        .empty h2 {
            color: #ffd76a;
        }

        .shop-btn {
            margin-top: 15px;
            padding: 12px 20px;
            border: 0;
            border-radius: 9px;
            background: #9de7ff;
            color: #061321;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width:600px) {

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .home-btn {
                width: 100%;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>

        <h1>🪔 Nashik Kumbh Jal</h1>

        <p>My Orders</p>

    </header>


    <div class="container">

        <div class="top-bar">

            <h2>📦 Your Orders</h2>

            <button
                class="home-btn"
                onclick="window.location.href='index.html'"
            >
                🏠 Back to Website
            </button>

        </div>


        <div id="ordersContainer">

            <div class="empty">

                <div class="empty-icon">
                    ⏳
                </div>

                <h2>Loading Orders...</h2>

            </div>

        </div>

    </div>


    <script>

        /* =====================================================
           GET ORDERS
           ===================================================== */

        function getOrders() {

            try {

                return JSON.parse(
                    localStorage.getItem(
                        "kumbhJalOrders"
                    )
                ) || [];

            } catch (error) {

                return [];

            }
        }


        /* =====================================================
           FORMAT DATE
           ===================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "-";

            }

            const date =
                new Date(dateValue);

            if (
                isNaN(
                    date.getTime()
                )
            ) {

                return "-";

            }

            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
        }


        /* =====================================================
           SHOW ORDERS
           ===================================================== */

        function showOrders() {

            const container =
                document.getElementById(
                    "ordersContainer"
                );

            const orders =
                getOrders();


            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            🛍️
                        </div>

                        <h2>
                            No Orders Yet
                        </h2>

                        <p>
                            You haven't placed any
                            Nashik Kumbh Jal orders yet.
                        </p>

                        <button
                            class="shop-btn"
                            onclick="
                                window.location.href='index.html'
                            "
                        >
                            🛒 Start Shopping
                        </button>

                    </div>

                `;

                return;
            }


            container.innerHTML = "";


            /* Newest order first */

            orders
                .slice()
                .reverse()
                .forEach(
                    order => {

                        const products =
                            order.cart || [];


                        let productHTML =
                            "";


                        products.forEach(
                            item => {

                                productHTML += `

                                    <div style="
                                        margin:6px 0;
                                    ">

                                        ${item.name || "-"}
                                        ×
                                        ${item.quantity || 0}

                                        —
                                        ₹${Number(
                                            item.price || 0
                                        ) *
                                        Number(
                                            item.quantity || 0
                                        )}

                                    </div>

                                `;

                            }
                        );


                        const tracking =
                            order.trackingNumber
                            ? order.trackingNumber
                            : "Not available yet";


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "order-card";


                        card.innerHTML = `

                            <div class="order-header">

                                <div class="order-id">

                                    ${order.orderId || "-"}

                                </div>

                                <div class="status">

                                    ${order.orderStatus || "Unknown"}

                                </div>

                            </div>


                            <div class="order-info">

                                <p>

                                    📅
                                    <strong>
                                        Order Date:
                                    </strong>

                                    ${formatDate(
                                        order.createdAt
                                    )}

                                </p>


                                <p>

                                    💳
                                    <strong>
                                        Payment:
                                    </strong>

                                    ${order.paymentStatus || "-"}

                                </p>


                                <p>

                                    ⚖️
                                    <strong>
                                        Packed Weight:
                                    </strong>

                                    ${order.totalWeight || 0} g

                                </p>


                                <p>

                                    🚚
                                    <strong>
                                        Tracking Number:
                                    </strong>

                                    ${tracking}

                                </p>


                                <div class="products">

                                    <strong>
                                        🛍️ Products
                                    </strong>

                                    ${productHTML}

                                </div>


                                <div class="total">

                                    Total:
                                    ₹${order.finalAmount || 0}

                                </div>


                                <div class="buttons">

                                    <button
                                        class="track-btn"
                                        onclick="
                                            trackOrder(
                                                '${order.orderId || ""}'
                                            )
                                        "
                                    >

                                        📦 Track Order

                                    </button>


                                    <button
                                        class="invoice-btn"
                                        onclick="
                                            viewInvoice(
                                                '${order.orderId || ""}'
                                            )
                                        "
                                    >

                                        🧾 View Invoice

                                    </button>

                                </div>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );
        }


        /* =====================================================
           TRACK ORDER
           ===================================================== */

        function trackOrder(orderId) {

            window.location.href =
                "track.html?orderId=" +
                encodeURIComponent(
                    orderId
                );
        }


        /* =====================================================
           VIEW INVOICE
           ===================================================== */

        function viewInvoice(orderId) {

            window.location.href =
                "invoice.html?orderId=" +
                encodeURIComponent(
                    orderId
                );
        }


        /* =====================================================
           START
           ===================================================== */

        showOrders();

    </script>

</body>

</html>
